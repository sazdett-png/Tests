<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Тести</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: #f3f4f6; }
        .btn-primary { background-color: #eab308; color: #111827; font-weight: bold; transition: all 0.2s; }
        .btn-primary:hover { background-color: #facc15; }
        .btn-secondary { background-color: #374151; color: #f3f4f6; transition: all 0.2s; }
        .btn-secondary:hover { background-color: #4b5563; }
        .card { background-color: #1f2937; border: 2px solid #374151; cursor: pointer; transition: all 0.2s; }
        .card:hover { border-color: #4b5563; }
        .card.active { border-color: #eab308; background-color: rgba(234, 179, 8, 0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Шапка -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-yellow-500">⚡ Тести</h1>
            <div id="navButtons">
                <button onclick="showScreen('editorScreen')" class="text-sm btn-secondary px-4 py-2 rounded">Редактор</button>
            </div>
        </header>

        <!-- ГОЛОВНИЙ ЕКРАН (Вибір категорій) -->
        <div id="homeScreen" class="space-y-6">
            <h2 class="text-xl font-semibold mb-2">Виберіть теми для тесту:</h2>
            <div id="categoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Картки генеруються через JS -->
            </div>
            <button onclick="startQuiz()" class="btn-primary w-full py-4 rounded text-lg mt-6 shadow-lg">Почати тест</button>
        </div>

        <!-- ЕКРАН РЕДАКТОРА -->
        <div id="editorScreen" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold">Редактор питань</h2>
                <button onclick="showScreen('homeScreen')" class="text-sm btn-secondary px-4 py-2 rounded">На головну</button>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="font-bold mb-4 text-yellow-500">Додати нове питання</h3>
                <div class="space-y-4">
                    <input type="text" id="qCategory" list="categoryList" placeholder="Категорія (напр. Основи AC, CEC Rules)" class="w-full bg-gray-700 border-gray-600 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <datalist id="categoryList"></datalist>
                    
                    <textarea id="qText" placeholder="Текст питання..." class="w-full bg-gray-700 border-gray-600 rounded p-3 text-white h-24 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                    
                    <div id="optionsContainer" class="space-y-2">
                        <input type="text" class="qOption w-full bg-gray-700 rounded p-2 text-white" placeholder="Варіант 1 (правильний)">
                        <input type="text" class="qOption w-full bg-gray-700 rounded p-2 text-white" placeholder="Варіант 2">
                        <input type="text" class="qOption w-full bg-gray-700 rounded p-2 text-white" placeholder="Варіант 3">
                        <input type="text" class="qOption w-full bg-gray-700 rounded p-2 text-white" placeholder="Варіант 4">
                    </div>
                    <button onclick="addQuestion()" class="btn-primary px-6 py-2 rounded w-full">Зберегти питання</button>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold">База питань (<span id="qCount">0</span>)</h3>
                    <div>
                        <button onclick="exportJSON()" class="text-xs btn-secondary px-2 py-1 rounded mr-2">Експорт</button>
                        <button onclick="document.getElementById('importFile').click()" class="text-xs btn-secondary px-2 py-1 rounded">Імпорт</button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
                    </div>
                </div>
                <div id="questionsList" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <!-- ЕКРАН ТЕСТУ -->
        <div id="quizScreen" class="hidden space-y-6">
            <div class="flex justify-between text-sm text-gray-400 mb-2">
                <span id="quizProgress">Питання 1 / 10</span>
                <button onclick="showScreen('homeScreen')" class="text-yellow-500 hover:underline">Перервати</button>
            </div>
            
            <div class="bg-gray-800 p-6 md:p-8 rounded-lg border border-gray-700">
                <h2 id="quizQuestionText" class="text-xl md:text-2xl font-semibold mb-6"></h2>
                <div id="quizOptions" class="space-y-3">
                    <!-- Варіанти відповідей -->
                </div>
            </div>
        </div>

        <!-- ЕКРАН РЕЗУЛЬТАТІВ -->
        <div id="resultScreen" class="hidden space-y-6 text-center">
            <div class="bg-gray-800 p-8 rounded-lg border border-gray-700">
                <h2 class="text-3xl font-bold mb-4">Тест завершено!</h2>
                <p class="text-xl mb-6">Твій результат: <span id="scoreText" class="text-yellow-500 font-bold"></span></p>
                
                <div id="mistakesReview" class="text-left bg-gray-900 p-4 rounded mb-6 hidden">
                    <h3 class="font-bold text-red-400 mb-3">Помилки:</h3>
                    <div id="mistakesList" class="space-y-4 text-sm"></div>
                </div>

                <button onclick="showScreen('homeScreen')" class="btn-primary px-8 py-3 rounded text-lg">Повернутися на головну</button>
            </div>
        </div>
    </div>

    <script>
        // Базові питання для 2 періоду SAIT (якщо база порожня)
        const defaultQuestions = [
            { id: "1", category: "Основи AC", text: "Яке значення напруги показує звичайний цифровий мультиметр при вимірюванні змінного струму?", options: ["RMS (Ефективне значення)", "Пікове значення (Peak)", "Середнє значення (Average)", "Миттєве значення"], answerIndex: 0 },
            { id: "2", category: "RLC Кола", text: "В ідеальному індуктивному колі (чиста індуктивність) як співвідносяться струм і напруга?", options: ["Струм відстає від напруги на 90°", "Струм випереджає напругу на 90°", "Збігаються по фазі", "Напруга відстає від струму на 90°"], answerIndex: 0 },
            { id: "3", category: "CEC Rules", text: "Який мінімальний розмір мідного проводу (AWG) допускається канадським кодом (CEC) для стандартних побутових розеток на 15А?", options: ["14 AWG", "12 AWG", "16 AWG", "10 AWG"], answerIndex: 0 },
            { id: "4", category: "RLC Кола", text: "Що відбувається із загальним опором кола при додаванні резисторів у паралельне з'єднання?", options: ["Зменшується", "Збільшується", "Залишається незмінним", "Дорівнює найбільшому резистору"], answerIndex: 0 }
        ];

        let questions = JSON.parse(localStorage.getItem('quiz_questions'));
        if (!questions || questions.length === 0) {
            questions = defaultQuestions;
            saveData();
        }
        
        let mistakeIds = JSON.parse(localStorage.getItem('quiz_mistakes')) || [];
        
        let selectedCategories = new Set();
        let currentQuizQuestions = [];
        let currentQIndex = 0;
        let score = 0;
        let userMistakes = []; // Помилки поточного тесту

        // Утиліта: Тасування масиву (Fisher-Yates)
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function saveData() {
            localStorage.setItem('quiz_questions', JSON.stringify(questions));
            localStorage.setItem('quiz_mistakes', JSON.stringify(mistakeIds));
        }

        // --- ЛОГІКА ГОЛОВНОГО ЕКРАНУ (КАТЕГОРІЇ) ---
        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';
            
            // Збираємо статистику по категоріях
            const catCounts = {};
            questions.forEach(q => {
                const c = q.category || 'Без категорії';
                catCounts[c] = (catCounts[c] || 0) + 1;
            });

            // Картка "Всі питання"
            grid.appendChild(createCategoryCard('Всі питання', questions.length, 'all'));

            // Картки категорій
            Object.keys(catCounts).sort().forEach(cat => {
                grid.appendChild(createCategoryCard(cat, catCounts[cat], cat));
            });

            // Картка "Робота над помилками" (тільки якщо є помилки)
            // Видаляємо неіснуючі ID з помилок
            mistakeIds = mistakeIds.filter(id => questions.find(q => q.id === id));
            saveData();

            if (mistakeIds.length > 0) {
                const errCard = createCategoryCard('🔥 Робота над помилками', mistakeIds.length, 'mistakes');
                errCard.classList.add('border-red-900', 'bg-red-900/20');
                grid.appendChild(errCard);
            }
        }

        function createCategoryCard(title, count, id) {
            const div = document.createElement('div');
            div.className = 'card p-4 rounded-lg flex flex-col justify-center items-center text-center h-28';
            if (selectedCategories.has(id)) div.classList.add('active');
            
            div.innerHTML = `
                <span class="font-bold text-lg text-gray-100">${title}</span>
                <span class="text-sm text-gray-400 mt-1">${count} питань</span>
            `;
            
            div.onclick = () => {
                // Логіка мульти-вибору
                if (id === 'all') {
                    selectedCategories.clear();
                    selectedCategories.add('all');
                } else {
                    selectedCategories.delete('all');
                    if (selectedCategories.has(id)) {
                        selectedCategories.delete(id);
                    } else {
                        selectedCategories.add(id);
                    }
                }
                renderCategories(); // Перемальовуємо, щоб оновити стилі
            };
            return div;
        }

        // --- ЛОГІКА ТЕСТУ ---
        function startQuiz() {
            if (selectedCategories.size === 0) {
                alert("Вибери хоча б одну категорію для тесту!");
                return;
            }

            let pool = [];
            if (selectedCategories.has('all')) {
                pool = [...questions];
            } else if (selectedCategories.has('mistakes')) {
                // Якщо вибрано тільки помилки або помилки + інші категорії
                let filterCats = Array.from(selectedCategories).filter(c => c !== 'mistakes');
                pool = questions.filter(q => {
                    return mistakeIds.includes(q.id) || filterCats.includes(q.category || 'Без категорії');
                });
            } else {
                let filterCats = Array.from(selectedCategories);
                pool = questions.filter(q => filterCats.includes(q.category || 'Без категорії'));
            }

            if (pool.length === 0) {
                alert("У вибраних категоріях немає питань.");
                return;
            }

            currentQuizQuestions = shuffle(pool); // Випадковий порядок питань
            currentQIndex = 0;
            score = 0;
            userMistakes = [];
            
            showScreen('quizScreen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQIndex >= currentQuizQuestions.length) {
                finishQuiz();
                return;
            }

            const q = currentQuizQuestions[currentQIndex];
            document.getElementById('quizProgress').innerText = `Питання ${currentQIndex + 1} / ${currentQuizQuestions.length} (${q.category})`;
            document.getElementById('quizQuestionText').innerText = q.text;

            // Готуємо варіанти відповідей з їх оригінальним індексом
            let mappedOptions = q.options.map((optText, index) => {
                return { text: optText, isCorrect: (index === q.answerIndex) };
            });

            // Випадковий порядок варіантів відповідей
            mappedOptions = shuffle(mappedOptions);

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            mappedOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-gray-700 hover:bg-gray-600 p-4 rounded border border-gray-600 transition-colors text-lg';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, q);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, questionObj) {
            if (isCorrect) {
                score++;
                // Якщо відповіли правильно — видаляємо з бази помилок
                mistakeIds = mistakeIds.filter(id => id !== questionObj.id);
            } else {
                userMistakes.push(questionObj);
                // Якщо помилились — додаємо в базу помилок (без дублікатів)
                if (!mistakeIds.includes(questionObj.id)) {
                    mistakeIds.push(questionObj.id);
                }
            }
            saveData();
            currentQIndex++;
            loadNextQuestion();
        }

        function finishQuiz() {
            showScreen('resultScreen');
            document.getElementById('scoreText').innerText = `${score} з ${currentQuizQuestions.length}`;

            const reviewDiv = document.getElementById('mistakesReview');
            const listDiv = document.getElementById('mistakesList');
            
            if (userMistakes.length > 0) {
                reviewDiv.classList.remove('hidden');
                listDiv.innerHTML = userMistakes.map(q => `
                    <div class="border-l-2 border-red-500 pl-3">
                        <p class="font-semibold">${q.text}</p>
                        <p class="text-green-400">Правильна відповідь: ${q.options[q.answerIndex]}</p>
                    </div>
                `).join('');
            } else {
                reviewDiv.classList.add('hidden');
            }
        }

        // --- ЛОГІКА РЕДАКТОРА ---
        function addQuestion() {
            const cat = document.getElementById('qCategory').value.trim() || 'Без категорії';
            const text = document.getElementById('qText').value.trim();
            const inputs = document.querySelectorAll('.qOption');
            
            let options = [];
            inputs.forEach(input => {
                if(input.value.trim() !== '') options.push(input.value.trim());
            });

            if (!text || options.length < 2) {
                alert("Введи питання та мінімум 2 варіанти відповіді!");
                return;
            }

            questions.unshift({
                id: Date.now().toString() + Math.floor(Math.random()*1000), // Унікальний ID
                category: cat,
                text: text,
                options: options,
                answerIndex: 0 // Перший введений варіант завжди правильний
            });

            saveData();
            
            // Очищення полів
            document.getElementById('qText').value = '';
            inputs.forEach(i => i.value = '');
            
            updateEditorList();
        }

        function deleteQuestion(id) {
            if(confirm("Точно видалити?")) {
                questions = questions.filter(q => q.id !== id);
                mistakeIds = mistakeIds.filter(mId => mId !== id);
                saveData();
                updateEditorList();
            }
        }

        function updateEditorList() {
            document.getElementById('qCount').innerText = questions.length;
            const list = document.getElementById('questionsList');
            list.innerHTML = questions.map(q => `
                <div class="bg-gray-700 p-3 rounded flex justify-between items-start">
                    <div>
                        <span class="text-xs font-bold text-yellow-500">[${q.category || 'Без категорії'}]</span>
                        <p class="font-semibold text-sm mt-1">${q.text}</p>
                    </div>
                    <button onclick="deleteQuestion('${q.id}')" class="text-red-400 hover:text-red-300 ml-2">❌</button>
                </div>
            `).join('');

            // Оновлення datalist для категорій
            const datalist = document.getElementById('categoryList');
            const uniqueCats = [...new Set(questions.map(q => q.category))].filter(c => c);
            datalist.innerHTML = uniqueCats.map(c => `<option value="${c}">`).join('');
        }

        // --- ІМПОРТ / ЕКСПОРТ ---
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "sait_quiz_backup.json");
            dlAnchorElem.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        // Переконуємось, що у всіх імпортованих питань є ID
                        imported.forEach(q => {
                            if (!q.id) q.id = Date.now().toString() + Math.floor(Math.random()*1000);
                        });
                        questions = imported;
                        mistakeIds = []; // Скидаємо помилки при повному імпорті бази
                        saveData();
                        updateEditorList();
                        alert("База питань успішно оновлена!");
                    }
                } catch (err) {
                    alert("Помилка читання файлу.");
                }
            };
            reader.readAsText(file);
        }

        // --- НАВІГАЦІЯ ---
        function showScreen(screenId) {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('editorScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
            
            if(screenId === 'homeScreen') {
                document.getElementById('navButtons').classList.remove('hidden');
                selectedCategories.clear();
                renderCategories();
            } else if (screenId === 'editorScreen') {
                updateEditorList();
            }
        }

        // Ініціалізація при старті
        showScreen('homeScreen');

    </script>
</body>
</html>
